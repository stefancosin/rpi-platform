<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensor Data</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a2e;
            color: #eaeaea;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .top-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 30px;
        }

        .back-btn {
            background-color: #16213e;
            border: none;
            border-radius: 6px;
            color: #eaeaea;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
        }

        .back-btn:hover { background-color: #0f3460; }

        h1 { color: #e94560; font-size: 24px; }
        h2 { color: #e94560; font-size: 18px; margin-bottom: 16px; }

        .card {
            background-color: #16213e;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .sensor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .sensor-card {
            background-color: #16213e;
            border-radius: 8px;
            padding: 30px 20px;
            text-align: center;
        }

        .sensor-card .label {
            font-size: 13px;
            color: #707080;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .sensor-card .value {
            font-size: 56px;
            font-weight: bold;
            color: #51cf66;
        }

        .sensor-card .unit {
            font-size: 16px;
            color: #707080;
            margin-top: 6px;
        }

        .sensor-card .no-data {
            font-size: 40px;
            color: #555;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: #0f3460;
            color: #eaeaea;
            padding: 10px 14px;
            text-align: left;
            font-size: 14px;
        }

        td {
            padding: 10px 14px;
            border-bottom: 1px solid #0f3460;
            font-size: 14px;
            color: #b0b0c0;
        }

        tr:hover td {
            background-color: #0f3460;
            color: #eaeaea;
        }

        .empty {
            color: #555;
            font-size: 14px;
        }

        .refresh-info {
            font-size: 12px;
            color: #707080;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div class="container">

    <div class="top-bar">
        <a class="back-btn" href="/">← Back</a>
        <h1>Sensor Data</h1>
    </div>

    <!-- Latest Temperature + Humidity -->
    <div class="sensor-grid">
        <div class="sensor-card">
            <div class="label">Temperature</div>
            <div class="value" id="val-temperature">
                <span class="no-data">--</span>
            </div>
            <div class="unit">°C</div>
        </div>
        <div class="sensor-card">
            <div class="label">Humidity</div>
            <div class="value" id="val-humidity">
                <span class="no-data">--</span>
            </div>
            <div class="unit">%</div>
        </div>
    </div>

    <!-- Log Table -->
    <div class="card">
        <h2>Last 10 Readings</h2>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Value</th>
                    <th>Timestamp</th>
                </tr>
            </thead>
            <tbody id="log-body">
                <tr>
                    <td colspan="3" class="empty">Loading...</td>
                </tr>
            </tbody>
        </table>
        <p class="refresh-info" id="refresh-info">Auto refreshing every 5 seconds</p>
    </div>

</div>

<script>
    function getSensors() {
        fetch('/get-sensors')
            .then(function(response) {
                return response.json();
            })
            .then(function(sensors) {
                /* Update latest temperature/humidity values */
                function latestOf(name) {
                    for (var i = sensors.length - 1; i >= 0; i--) {
                        if (sensors[i].name === name) {
                            return sensors[i];
                        }
                    }
                    return null;
                }

                function applyLatest(elId, reading) {
                    var el = document.getElementById(elId);
                    if (reading) {
                        el.textContent = reading.value;
                    } else {
                        el.innerHTML = '<span class="no-data">--</span>';
                    }
                }

                applyLatest('val-temperature', latestOf('temperature'));
                applyLatest('val-humidity', latestOf('humidity'));

                /* Show last 10 readings in log */
                var last10 = sensors.slice(-10).reverse();
                var tbody  = document.getElementById('log-body');

                if (last10.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" class="empty">No data yet</td></tr>';
                    return;
                }

                var html = '';
                for (var j = 0; j < last10.length; j++) {
                    var s = last10[j];
                    html += '<tr>';
                    html += '<td>' + s.name      + '</td>';
                    html += '<td>' + s.value      + '</td>';
                    html += '<td>' + s.timestamp  + '</td>';
                    html += '</tr>';
                }
                tbody.innerHTML = html;

                var now = new Date();
                document.getElementById('refresh-info').textContent =
                    'Last updated: ' + now.toLocaleTimeString() +
                    ' — auto refreshing every 5 seconds';
            })
            .catch(function() {
                document.getElementById('log-body').innerHTML =
                    '<tr><td colspan="3" class="empty">Failed to load data</td></tr>';
            });
    }

    getSensors();
    setInterval(getSensors, 5000);
</script>
</body>
</html>
